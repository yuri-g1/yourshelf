name: Refresh trending

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  API_URL: https://yourshelf.onrender.com

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the API
        run: curl --silent --show-error --fail --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors "$API_URL/health"

      - name: Refresh trending
        run: curl --silent --show-error --fail --max-time 120 --retry 2 --retry-delay 15 --retry-all-errors -X POST "$API_URL/trending/refresh"
